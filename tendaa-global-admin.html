<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tendaa Global — Verification Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0F1B2D;
    --navy-deep: #0A1220;
    --navy-mid: #17263D;
    --clay: #B85C38;
    --clay-bright: #D3703F;
    --gold: #D4A54A;
    --ivory: #F2ECDE;
    --ivory-dim: #C9C2AF;
    --ink: #2A3446;
    --line: rgba(15,27,45,0.13);
    --green: #4A7C59;
    --red: #B03A2E;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #F7F4EC; color: var(--ink); font-family: 'Inter', sans-serif; line-height: 1.5; }
  h1, h2, h3, .display { font-family: 'Space Grotesk', sans-serif; letter-spacing: -0.01em; }

  /* Top bar */
  .topbar {
    background: var(--navy-deep);
    color: var(--ivory);
    padding: 0.9rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .topbar-brand { display: flex; align-items: center; gap: 0.6rem; font-weight: 600; }
  .topbar-mark { width: 22px; height: 22px; }
  .topbar-tag { font-size: 0.8rem; color: var(--gold); border: 1px solid var(--gold); border-radius: 3px; padding: 0.15rem 0.5rem; margin-left: 0.5rem; }
  .topbar-stats { display: flex; gap: 1.75rem; font-size: 0.85rem; color: var(--ivory-dim); }
  .topbar-stats b { color: var(--ivory); font-family: 'Space Grotesk', sans-serif; }

  /* Layout */
  .layout {
    display: grid;
    grid-template-columns: 1fr;
    max-width: 1200px;
    margin: 0 auto;
  }
  @media (min-width: 900px) {
    .layout { grid-template-columns: 380px 1fr; min-height: calc(100vh - 56px); }
  }

  /* List panel */
  .list-panel { border-right: 1px solid var(--line); background: #fff; }
  .tabs { display: flex; gap: 0.4rem; padding: 1rem 1rem 0; overflow-x: auto; }
  .tab {
    font-size: 0.85rem;
    padding: 0.5rem 0.9rem;
    border-radius: 3px;
    color: #6B7383;
    cursor: pointer;
    white-space: nowrap;
    border: 1px solid transparent;
  }
  .tab.active { background: var(--navy); color: var(--ivory); }

  .app-list { padding: 1rem; display: flex; flex-direction: column; gap: 0.6rem; }
  .app-card {
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 0.9rem 1rem;
    cursor: pointer;
  }
  .app-card.selected { border-color: var(--clay); background: #FBF8F2; }
  .app-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5rem; }
  .app-name { font-weight: 600; font-size: 0.98rem; }
  .app-meta { font-size: 0.8rem; color: #6B7383; margin-top: 0.3rem; }
  .status-badge {
    font-size: 0.72rem;
    font-weight: 600;
    padding: 0.2rem 0.55rem;
    border-radius: 20px;
    white-space: nowrap;
  }
  .status-pending { background: #F1E6C9; color: #8A6A1F; }
  .status-needsinfo { background: #EAD9CC; color: var(--clay); }
  .status-approved { background: #DCE9DF; color: var(--green); }
  .status-rejected { background: #F0D8D5; color: var(--red); }

  /* Detail panel */
  .detail-panel { padding: 1.75rem; }
  .detail-empty { color: #8A93A3; padding: 3rem 1rem; text-align: center; }

  .detail-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; flex-wrap: wrap; }
  .detail-header h2 { font-size: 1.5rem; }
  .detail-sub { font-size: 0.9rem; color: #6B7383; margin-top: 0.3rem; }

  .detail-grid { display: grid; gap: 1.5rem; margin-top: 2rem; }
  @media (min-width: 640px) { .detail-grid { grid-template-columns: 1fr 1fr; } }

  .info-block { background: #fff; border: 1px solid var(--line); border-radius: 4px; padding: 1.1rem 1.25rem; }
  .info-block-title { font-size: 0.8rem; font-weight: 600; color: var(--clay); margin-bottom: 0.6rem; font-family: 'Space Grotesk', sans-serif; }
  .info-row { display: flex; justify-content: space-between; font-size: 0.9rem; padding: 0.35rem 0; border-bottom: 1px solid rgba(15,27,45,0.06); }
  .info-row:last-child { border-bottom: none; }
  .info-row .label { color: #6B7383; }
  .info-row .value { font-weight: 500; text-align: right; }

  .description-block { grid-column: 1 / -1; }

  /* Checklist */
  .checklist-block { margin-top: 1.5rem; background: #fff; border: 1px solid var(--line); border-radius: 4px; padding: 1.25rem; }
  .checklist-title { font-size: 0.95rem; font-weight: 600; margin-bottom: 1rem; }
  .checklist-item { display: flex; align-items: center; gap: 0.65rem; padding: 0.55rem 0; font-size: 0.92rem; }
  .checklist-item input { width: 18px; height: 18px; accent-color: var(--clay); }

  /* Notes */
  .notes-block { margin-top: 1.5rem; }
  .notes-block label { font-size: 0.85rem; font-weight: 500; margin-bottom: 0.5rem; display: block; }
  textarea {
    width: 100%; min-height: 90px; padding: 0.75rem 0.9rem;
    border: 1px solid var(--line); border-radius: 3px; font-family: 'Inter', sans-serif; font-size: 0.92rem;
  }

  /* Actions */
  .actions { display: flex; gap: 0.75rem; margin-top: 1.5rem; flex-wrap: wrap; }
  .btn { padding: 0.75rem 1.4rem; border-radius: 3px; font-weight: 600; font-size: 0.9rem; border: none; cursor: pointer; font-family: 'Inter', sans-serif; }
  .btn-approve { background: var(--green); color: #fff; }
  .btn-info { background: var(--clay); color: #fff; }
  .btn-reject { background: transparent; color: var(--red); border: 1px solid var(--red); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .decided-note { margin-top: 1.25rem; font-size: 0.85rem; padding: 0.75rem 1rem; border-radius: 3px; }
  .decided-note.approved { background: #DCE9DF; color: var(--green); }
  .decided-note.rejected { background: #F0D8D5; color: var(--red); }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-brand">
    <svg class="topbar-mark" viewBox="0 0 64 64" fill="none">
      <path d="M6 40C6 24 16 10 32 10" stroke="#D4A54A" stroke-width="6" stroke-linecap="round"/>
      <path d="M58 24C58 40 48 54 32 54" stroke="#D3703F" stroke-width="6" stroke-linecap="round"/>
      <circle cx="32" cy="10" r="7" fill="#D4A54A"/>
      <circle cx="32" cy="54" r="7" fill="#D3703F"/>
    </svg>
    Tendaa Global <span class="topbar-tag">Verification Admin</span>
  </div>
  <div class="topbar-stats">
    <div><b id="statPending">0</b> pending</div>
    <div><b id="statInfo">0</b> needs info</div>
    <div><b id="statApproved">0</b> approved</div>
  </div>
</div>

<div class="layout">
  <div class="list-panel">
    <div class="tabs" id="tabs">
      <div class="tab active" data-filter="all">All</div>
      <div class="tab" data-filter="pending">Pending</div>
      <div class="tab" data-filter="needsinfo">Needs info</div>
      <div class="tab" data-filter="approved">Approved</div>
      <div class="tab" data-filter="rejected">Rejected</div>
    </div>
    <div class="app-list" id="appList"></div>
  </div>

  <div class="detail-panel" id="detailPanel">
    <div class="detail-empty">Select an application from the list to review it.</div>
  </div>
</div>

<script>
  const applications = [
    {
      id: 1, company: "Amara Textile Works", tier: "Bridge Partner", direction: "African brand seeking global partners",
      country: "Nigeria", regNumber: "RC-1182934", years: 6, size: "51–200 employees", category: "Fashion & Apparel",
      website: "amaratextileworks.com", contact: "Ngozi Adeyemi", role: "Head of Partnerships", email: "ngozi@amaratextileworks.com",
      submitted: "Aug 24, 2026", status: "pending",
      description: "Manufacturer of woven and printed textiles, exporting to 4 West African countries, seeking European retail distribution.",
      checklist: { reg: false, refs: false, trade: false }
    },
    {
      id: 2, company: "Voss & Norwood Retail Group", tier: "Verified", direction: "Global brand entering Africa",
      country: "United Kingdom", regNumber: "GB-04471029", years: 14, size: "200+ employees", category: "Retail & E-commerce",
      website: "vossnorwood.co.uk", contact: "James Norwood", role: "VP International", email: "jnorwood@vossnorwood.co.uk",
      submitted: "Aug 26, 2026", status: "pending",
      description: "Mid-market homeware retailer exploring East African market entry through local distribution partners.",
      checklist: { reg: false, refs: false, trade: false }
    },
    {
      id: 3, company: "Lagos Fine Furniture Co", tier: "Listed", direction: "African brand seeking global partners",
      country: "Nigeria", regNumber: "RC-0994512", years: 3, size: "11–50 employees", category: "Furniture & Home",
      website: "lagosfinefurniture.com", contact: "Emeka Obi", role: "Founder", email: "emeka@lagosfinefurniture.com",
      submitted: "Aug 20, 2026", status: "needsinfo",
      description: "Handcrafted industrial furniture brand, currently selling only domestically, exploring export readiness.",
      checklist: { reg: true, refs: false, trade: false }
    },
    {
      id: 4, company: "Meridian Foods International", tier: "Strategic", direction: "Both",
      country: "South Africa", regNumber: "ZA-2019/778", years: 11, size: "200+ employees", category: "Food & Beverage",
      website: "meridianfoods.co.za", contact: "Thandiwe Mokoena", role: "Chief Growth Officer", email: "tmokoena@meridianfoods.co.za",
      submitted: "Aug 18, 2026", status: "approved",
      description: "Regional food distributor with manufacturing partnerships across 5 African countries, seeking exclusive category rights.",
      checklist: { reg: true, refs: true, trade: true }
    },
    {
      id: 5, company: "Bright Pixel Media", tier: "Listed", direction: "African brand seeking global partners",
      country: "Kenya", regNumber: "KE-PVT-88213", years: 1, size: "1–10 employees", category: "Media & Entertainment",
      website: "", contact: "Kevin Otieno", role: "Founder", email: "kevin@brightpixel.io",
      submitted: "Aug 27, 2026", status: "rejected",
      description: "Early-stage production studio, no registered trading history yet — application incomplete.",
      checklist: { reg: false, refs: false, trade: false }
    },
    {
      id: 6, company: "Continental Cold Chain Logistics", tier: "Bridge Partner", direction: "Global brand entering Africa",
      country: "Netherlands", regNumber: "NL-KVK-77213410", years: 22, size: "200+ employees", category: "Logistics & Distribution",
      website: "ccchain.eu", contact: "Anke Bergman", role: "Head of Emerging Markets", email: "a.bergman@ccchain.eu",
      submitted: "Aug 29, 2026", status: "pending",
      description: "Cold-chain logistics operator seeking vetted last-mile partners across Nigeria and Ghana for perishable exports.",
      checklist: { reg: false, refs: false, trade: false }
    }
  ];

  let currentFilter = 'all';
  let selectedId = null;

  const statusLabel = { pending: 'Pending review', needsinfo: 'Needs info', approved: 'Approved', rejected: 'Rejected' };
  const statusClass = { pending: 'status-pending', needsinfo: 'status-needsinfo', approved: 'status-approved', rejected: 'status-rejected' };

  function renderList() {
    const list = document.getElementById('appList');
    list.innerHTML = '';
    const filtered = applications.filter(a => currentFilter === 'all' || a.status === currentFilter);
    filtered.forEach(app => {
      const card = document.createElement('div');
      card.className = 'app-card' + (app.id === selectedId ? ' selected' : '');
      card.innerHTML = `
        <div class="app-card-top">
          <div>
            <div class="app-name">${app.company}</div>
            <div class="app-meta">${app.tier} · ${app.country}</div>
          </div>
          <div class="status-badge ${statusClass[app.status]}">${statusLabel[app.status]}</div>
        </div>
        <div class="app-meta" style="margin-top:0.5rem;">Submitted ${app.submitted}</div>
      `;
      card.addEventListener('click', () => { selectedId = app.id; renderList(); renderDetail(); });
      list.appendChild(card);
    });
    updateStats();
  }

  function updateStats() {
    document.getElementById('statPending').textContent = applications.filter(a => a.status === 'pending').length;
    document.getElementById('statInfo').textContent = applications.filter(a => a.status === 'needsinfo').length;
    document.getElementById('statApproved').textContent = applications.filter(a => a.status === 'approved').length;
  }

  function renderDetail() {
    const panel = document.getElementById('detailPanel');
    const app = applications.find(a => a.id === selectedId);
    if (!app) {
      panel.innerHTML = '<div class="detail-empty">Select an application from the list to review it.</div>';
      return;
    }

    const decided = app.status === 'approved' || app.status === 'rejected';

    panel.innerHTML = `
      <div class="detail-header">
        <div>
          <h2>${app.company}</h2>
          <div class="detail-sub">${app.tier} membership · ${app.direction}</div>
        </div>
        <div class="status-badge ${statusClass[app.status]}">${statusLabel[app.status]}</div>
      </div>

      <div class="detail-grid">
        <div class="info-block">
          <div class="info-block-title">Company</div>
          <div class="info-row"><span class="label">Country</span><span class="value">${app.country}</span></div>
          <div class="info-row"><span class="label">Registration #</span><span class="value">${app.regNumber}</span></div>
          <div class="info-row"><span class="label">Years operating</span><span class="value">${app.years}</span></div>
          <div class="info-row"><span class="label">Company size</span><span class="value">${app.size}</span></div>
          <div class="info-row"><span class="label">Category</span><span class="value">${app.category}</span></div>
          <div class="info-row"><span class="label">Website</span><span class="value">${app.website || '—'}</span></div>
        </div>
        <div class="info-block">
          <div class="info-block-title">Contact</div>
          <div class="info-row"><span class="label">Name</span><span class="value">${app.contact}</span></div>
          <div class="info-row"><span class="label">Role</span><span class="value">${app.role}</span></div>
          <div class="info-row"><span class="label">Email</span><span class="value">${app.email}</span></div>
          <div class="info-row"><span class="label">Submitted</span><span class="value">${app.submitted}</span></div>
        </div>
        <div class="info-block description-block">
          <div class="info-block-title">Business description</div>
          <p style="font-size:0.92rem;">${app.description}</p>
        </div>
      </div>

      <div class="checklist-block">
        <div class="checklist-title">Verification checklist</div>
        <label class="checklist-item"><input type="checkbox" data-check="reg" ${app.checklist.reg ? 'checked' : ''} ${decided ? 'disabled' : ''}> Business registration confirmed against public registry</label>
        <label class="checklist-item"><input type="checkbox" data-check="refs" ${app.checklist.refs ? 'checked' : ''} ${decided ? 'disabled' : ''}> Trade references contacted and confirmed</label>
        <label class="checklist-item"><input type="checkbox" data-check="trade" ${app.checklist.trade ? 'checked' : ''} ${decided ? 'disabled' : ''}> Trade/operating history reviewed</label>
      </div>

      <div class="notes-block">
        <label for="reviewNotes">Reviewer notes</label>
        <textarea id="reviewNotes" placeholder="Internal notes — not visible to applicant." ${decided ? 'disabled' : ''}></textarea>
      </div>

      ${decided
        ? `<div class="decided-note ${app.status}">${app.status === 'approved' ? 'This application has been approved and the applicant notified.' : 'This application has been rejected. The applicant has been notified by email.'}</div>`
        : `<div class="actions">
            <button class="btn btn-approve" id="btnApprove">Approve & issue badge</button>
            <button class="btn btn-info" id="btnInfo">Request more info</button>
            <button class="btn btn-reject" id="btnReject">Reject</button>
          </div>`
      }
    `;

    if (!decided) {
      panel.querySelectorAll('[data-check]').forEach(box => {
        box.addEventListener('change', (e) => {
          app.checklist[e.target.dataset.check] = e.target.checked;
        });
      });
      document.getElementById('btnApprove').addEventListener('click', () => { app.status = 'approved'; renderList(); renderDetail(); });
      document.getElementById('btnInfo').addEventListener('click', () => { app.status = 'needsinfo'; renderList(); renderDetail(); });
      document.getElementById('btnReject').addEventListener('click', () => { app.status = 'rejected'; renderList(); renderDetail(); });
    }
  }

  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentFilter = tab.dataset.filter;
      renderList();
    });
  });

  renderList();
</script>

</body>
</html>
